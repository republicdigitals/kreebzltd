[build]
  # Next.js static export (output: "export") writes to distDir "dist"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Static export produces plain HTML/CSS/JS — no serverless runtime needed.
# SPA-style fallback so unknown routes serve a 404 handled by the static pages.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
